<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chroma Sort</title>
<style>
:root{--bg:#050a1d;--card:rgba(8,14,38,.9);--line:rgba(150,180,255,.25);--txt:#eaf2ff;--sub:rgba(220,235,255,.62);--accent:#ff8a1c;--bw:58px;--bh:148px}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation}body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:radial-gradient(circle at 20% 5%,#16307d 0,transparent 34%),radial-gradient(circle at 85% 95%,#38166e 0,transparent 36%),linear-gradient(#050a1d,#07102b);color:var(--txt);user-select:none;-webkit-user-select:none}button{font-family:inherit;color:inherit}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}.bar{background:rgba(2,6,20,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}.title{line-height:1.1}.stage{font-weight:900;font-size:19px}.diff{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:9px;font-size:10px;font-weight:900;letter-spacing:1px}.beginner{background:rgba(0,220,100,.18);color:#47ff93}.easy{background:rgba(0,190,255,.18);color:#5adfff}.normal{background:rgba(255,190,30,.18);color:#ffd15a}.hard{background:rgba(255,80,40,.22);color:#ff9972}.coins{font-weight:900;color:#ffd15a;background:rgba(255,210,60,.1);border:1px solid rgba(255,210,60,.32);border-radius:18px;padding:7px 11px}.gear{width:42px;height:42px;border-radius:13px;border:1px solid rgba(255,150,60,.45);background:rgba(255,130,35,.18);font-size:20px}
#game{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}.grid{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px;justify-items:center;align-items:end}.bottle{height:calc(var(--bh) + 20px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;transition:.18s transform,.18s filter}.bottle.sel{transform:translateY(-14px) scale(1.06);filter:drop-shadow(0 0 18px rgba(255,255,255,.45))}.cap{width:var(--bw);height:20px;border-radius:18px 18px 4px 4px;background:linear-gradient(160deg,#4c4c4c,#050505);box-shadow:0 4px 10px rgba(0,0,0,.65),inset 0 1px 3px rgba(255,255,255,.25)}.body{width:var(--bw);height:var(--bh);border-radius:3px 3px 17px 17px;border:2px solid rgba(220,240,255,.28);background:rgba(180,220,255,.08);overflow:hidden;position:relative;box-shadow:inset -12px 0 24px rgba(0,0,0,.45),inset 8px 0 14px rgba(255,255,255,.1),0 8px 18px rgba(0,0,0,.5)}.liq{position:absolute;inset:0;display:flex;flex-direction:column-reverse}.seg{flex:1;position:relative}.seg+ .seg{border-bottom:2px solid rgba(0,0,0,.34)}.seg[data-sym]::before{content:attr(data-sym);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bw)*.35);font-weight:900;color:rgba(255,255,255,.9);text-shadow:0 2px 4px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.55)}.seg.light[data-sym]::before{color:rgba(0,0,0,.75);text-shadow:0 1px 1px rgba(255,255,255,.35)}.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.38),rgba(255,255,255,.08) 25%,transparent 55%,rgba(0,0,0,.34));z-index:3}.done .body{box-shadow:0 0 28px var(--glow),inset -12px 0 24px rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.5)}.shake{animation:shake .35s}@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.footer{display:flex;gap:9px;background:rgba(2,6,20,.9);border-top:1px solid var(--line);padding:10px 12px max(12px,env(safe-area-inset-bottom))}.act{flex:1;border:0;border-radius:16px;background:linear-gradient(160deg,#ff9328,#dc4f00);padding:9px 4px;font-weight:800;box-shadow:0 4px 14px rgba(210,75,0,.45)}.act:disabled{opacity:.35}.act small{display:block;color:rgba(255,255,255,.75);font-size:10px;font-weight:700}.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.74);backdrop-filter:blur(12px);padding:22px;z-index:20}.hidden{display:none}.card{width:100%;max-width:360px;background:rgba(8,13,34,.96);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.55)}.card h2{text-align:center;margin-bottom:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}.row:last-child{border-bottom:0}.lbl{font-size:14px;color:var(--sub);font-weight:700}.grp{display:flex;gap:5px}.pill,.tog{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:900}.pill.on,.tog.on{background:rgba(255,135,35,.45);border-color:rgba(255,160,60,.75);color:#fff}.close,.danger,.next{width:100%;margin-top:12px;padding:13px;border-radius:14px;border:0;font-weight:900}.close{background:rgba(255,255,255,.09)}.danger{background:rgba(240,70,70,.16);color:#ffb1b1;border:1px solid rgba(240,70,70,.35)}.next{background:linear-gradient(135deg,#5c40e8,#2c13a8)}
</style>
</head>
<body>
<div id="app">
  <header class="bar"><div class="title"><div class="stage" id="stage">Stage 1</div><div id="diff" class="diff easy">EASY / 8色</div></div><div class="coins">🪙 <span id="coins">100</span></div><button class="gear" id="open">⚙️</button></header>
  <main id="game"><div class="grid" id="grid"></div></main>
  <footer class="footer"><button class="act" id="undo">↩<small>Undo</small></button><button class="act" id="restart">↺<small>Restart</small></button><button class="act" id="hint">💡<small>Hint -10</small></button><button class="act" id="extra">🧪<small>+Bottle -20</small></button></footer>
</div>
<div id="set" class="modal hidden"><div class="card"><h2>⚙️ 設定</h2><div class="row"><span class="lbl">🎚️ 難易度 / 色数</span><div class="grp" id="colors"><button class="pill" data-v="4">4</button><button class="pill" data-v="8">8</button><button class="pill" data-v="12">12</button><button class="pill" data-v="16">16</button></div></div><div class="row"><span class="lbl">🔣 記号表示</span><button class="tog" id="sym">OFF</button></div><button class="danger" id="reset">データ初期化</button><button class="close" id="close">閉じる</button></div></div>
<div id="clear" class="modal hidden"><div class="card"><h2>🎉 Complete!</h2><p style="text-align:center;color:#ffd15a;font-weight:900;margin-bottom:10px">+20 コイン</p><button class="next" id="next">Next Stage →</button></div></div>
<script>
'use strict';
const CAP=4,IC=100,REWARD=20,HCOST=10,XCOST=20,MAXX=3;
const COLORS=[
{id:'red',name:'赤',sym:'●',light:false,bg:'linear-gradient(#ff3b30,#b00000)',gl:'#ff3333'},
{id:'blue',name:'青',sym:'■',light:false,bg:'linear-gradient(#2f5bff,#0019b8)',gl:'#3157ff'},
{id:'green',name:'緑',sym:'＋',light:false,bg:'linear-gradient(#00df63,#008537)',gl:'#00e060'},
{id:'yellow',name:'黄',sym:'★',light:true,bg:'linear-gradient(#fff23a,#c9a200)',gl:'#ffe24a'},
{id:'orange',name:'橙',sym:'▲',light:false,bg:'linear-gradient(#ff9d00,#c94d00)',gl:'#ff8500'},
{id:'cyan',name:'水',sym:'○',light:true,bg:'linear-gradient(#12c8ff,#0064b7)',gl:'#17c4ff'},
{id:'purple',name:'紫',sym:'◆',light:false,bg:'linear-gradient(#c526ff,#7a00be)',gl:'#bc22ff'},
{id:'pink',name:'桃',sym:'♥',light:false,bg:'linear-gradient(#ff4fbd,#be0060)',gl:'#ff35a9'},
{id:'gray',name:'灰',sym:'×',light:true,bg:'linear-gradient(#bfc5ca,#696f75)',gl:'#b8c0c8'},
{id:'brown',name:'茶',sym:'⬟',light:false,bg:'linear-gradient(#bf6a2c,#74350e)',gl:'#b45b22'},
{id:'lime',name:'黄緑',sym:'✚',light:true,bg:'linear-gradient(#cfff19,#75a900)',gl:'#c9ff18'},
{id:'teal',name:'青緑',sym:'◇',light:false,bg:'linear-gradient(#00e4c4,#007861)',gl:'#00d7bd'},
{id:'cream',name:'白',sym:'☀',light:true,bg:'linear-gradient(#fffbe0,#dfbf75)',gl:'#fff7c8'},
{id:'indigo',name:'藍',sym:'⬢',light:false,bg:'linear-gradient(#7442ff,#3000a8)',gl:'#7040ff'},
{id:'silver',name:'銀',sym:'✦',light:true,bg:'linear-gradient(#b7d7f4,#6d91b5)',gl:'#a9ceef'},
{id:'lavender',name:'薄紫',sym:'✿',light:true,bg:'linear-gradient(#e3a3ff,#8e63c7)',gl:'#d7a1ff'}
];
const byId=Object.fromEntries(COLORS.map(c=>[c.id,c]));
const diffName=n=>n<=4?['beginner','BEGINNER']:n<=8?['easy','EASY']:n<=12?['normal','NORMAL']:['hard','HARD'];
let st={lv:1,coins:IC,colors:16,sym:false,extra:0,b:[],init:[],hist:[],sel:null,hints:[]};
const $=id=>document.getElementById(id), save=()=>localStorage.setItem('chroma-sort-v2',JSON.stringify({...st,sel:null,hints:[]}));
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function canMove(b,from,to){const f=b[from],t=b[to];if(!f.length||t.length>=CAP)return false;return !t.length||t[t.length-1]===f[f.length-1]}
function moveRaw(b,from,to){if(!canMove(b,from,to))return false;const f=b[from],t=b[to],c=f[f.length-1];let n=0;for(let i=f.length-1;i>=0&&f[i]===c;i--)n++;n=Math.min(n,CAP-t.length);while(n--)t.push(f.pop());return true}
function gen(lv=1,n=16){let b=[];COLORS.slice(0,n).forEach(c=>b.push(Array(CAP).fill(c.id)));for(let i=0;i<4;i++)b.push([]);const r=rng(lv*9127+n*311),loops={4:24,8:80,12:180,16:380}[n];for(let k=0;k<loops;k++){let tries=0;while(tries++<80){let a=Math.floor(r()*b.length),d=Math.floor(r()*b.length);if(a!==d&&moveRaw(b,a,d))break}}return b}
function newGame(keepCoins=true){const coins=keepCoins?st.coins:IC;st={...st,coins,extra:0,b:gen(st.lv,st.colors),hist:[],sel:null,hints:[]};st.init=st.b.map(x=>x.slice());save();render()}
function load(){try{const x=JSON.parse(localStorage.getItem('chroma-sort-v2')||'null');if(x&&Array.isArray(x.b)){st={...st,...x,sel:null,hints:[]};return}}catch(e){}newGame(false)}
function colsFor(total){return total<=8?4:total<=12?4:total<=16?4:5}
function resize(){const rows=Math.ceil(st.b.length/colsFor(st.b.length)),h=$('game').clientHeight,w=$('grid').clientWidth||innerWidth;const bh=Math.max(84,Math.min(180,Math.floor((h-26-(rows-1)*8)/rows)-20));const bw=Math.max(42,Math.min(72,Math.floor((w-(colsFor(st.b.length)-1)*6)/colsFor(st.b.length))-8));document.documentElement.style.setProperty('--bh',bh+'px');document.documentElement.style.setProperty('--bw',bw+'px')}
function render(){const [cls,label]=diffName(st.colors);$('stage').textContent='Stage '+st.lv;$('diff').textContent=label+' / '+st.colors+'色';$('diff').className='diff '+cls;$('coins').textContent=st.coins;$('undo').disabled=!st.hist.length;$('hint').disabled=st.coins<HCOST;$('extra').disabled=st.coins<XCOST||st.extra>=MAXX;$('grid').style.gridTemplateColumns=`repeat(${colsFor(st.b.length)},1fr)`;$('grid').innerHTML='';resize();st.b.forEach((arr,i)=>{const wrap=document.createElement('div');wrap.className='bottle'+(st.sel===i?' sel':'')+(arr.length===CAP&&arr.every(x=>x===arr[0])?' done':'')+(st.hints.includes(i)?' hint':'');wrap.dataset.i=i;if(arr[0])wrap.style.setProperty('--glow',byId[arr[0]].gl+'99');wrap.innerHTML='<div class="cap"></div><div class="body"><div class="liq"></div><div class="glass"></div></div>';const liq=wrap.querySelector('.liq');for(let j=0;j<CAP;j++){const seg=document.createElement('div');seg.className='seg';if(arr[j]){const c=byId[arr[j]];seg.style.background=c.bg;if(st.sym){seg.dataset.sym=c.sym;if(c.light)seg.classList.add('light')}}liq.appendChild(seg)}$('grid').appendChild(wrap)});document.querySelectorAll('#colors .pill').forEach(b=>b.classList.toggle('on',+b.dataset.v===st.colors));$('sym').textContent=st.sym?'ON':'OFF';$('sym').className='tog'+(st.sym?' on':'')}
function bad(i){const e=document.querySelector(`.bottle[data-i="${i}"]`);if(e){e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),360)}}
function tap(i){clearTimeout(window.ht);if(st.sel===null){if(!st.b[i].length)return bad(i);st.sel=i;st.hints=[];render();return}if(st.sel===i){st.sel=null;render();return}if(canMove(st.b,st.sel,i)){st.hist.push({b:st.b.map(x=>x.slice()),extra:st.extra});moveRaw(st.b,st.sel,i);st.sel=null;st.hints=[];if(win()){st.coins+=REWARD;save();render();$('clear').classList.remove('hidden');return}save();render()}else bad(i)}
function win(){return st.b.every(a=>!a.length||a.length===CAP&&a.every(x=>x===a[0]))}
function hint(){if(st.coins<HCOST)return;for(let i=0;i<st.b.length;i++)for(let j=0;j<st.b.length;j++)if(i!==j&&canMove(st.b,i,j)){st.coins-=HCOST;st.sel=null;st.hints=[i,j];save();render();window.ht=setTimeout(()=>{st.hints=[];render()},3000);return}}
$('grid').onclick=e=>{const b=e.target.closest('.bottle');if(b)tap(+b.dataset.i)};$('undo').onclick=()=>{const h=st.hist.pop();if(!h)return;st.b=h.b.map(x=>x.slice());st.extra=h.extra;st.sel=null;st.hints=[];save();render()};$('restart').onclick=()=>{st.b=st.init.map(x=>x.slice());st.hist=[];st.sel=null;st.hints=[];save();render()};$('hint').onclick=hint;$('extra').onclick=()=>{if(st.coins<XCOST||st.extra>=MAXX)return;st.hist.push({b:st.b.map(x=>x.slice()),extra:st.extra});st.coins-=XCOST;st.extra++;st.b.push([]);save();render()};$('open').onclick=()=>{$('set').classList.remove('hidden');render()};$('close').onclick=()=>$('set').classList.add('hidden');$('set').onclick=e=>{if(e.target.id==='set')$('set').classList.add('hidden')};$('sym').onclick=()=>{st.sym=!st.sym;save();render()};$('colors').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.colors=+b.dataset.v;st.lv=1;newGame(true)};$('reset').onclick=()=>{if(confirm('すべて初期化しますか？')){localStorage.removeItem('chroma-sort-v2');st={lv:1,coins:IC,colors:16,sym:false,extra:0,b:[],init:[],hist:[],sel:null,hints:[]};newGame(false);$('set').classList.add('hidden')}};$('next').onclick=()=>{$('clear').classList.add('hidden');st.lv++;newGame(true)};addEventListener('resize',()=>setTimeout(render,120));load();render();
</script>
</body>
</html>
