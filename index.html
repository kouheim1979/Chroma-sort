<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chroma Sort</title><style>body{margin:0;background:#050a1c;color:#eaf2ff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;overflow:hidden;user-select:none}#app{height:100vh;max-width:500px;margin:auto;display:flex;flex-direction:column}header,footer{background:#030716ee;padding:10px;display:flex;gap:8px;align-items:center;border-color:#78a0ff44}header{justify-content:space-between;border-bottom:1px solid #78a0ff44}footer{border-top:1px solid #78a0ff44}.stage{font-size:20px;font-weight:900}.badge{display:inline-block;margin-top:3px;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:900}.easy{background:#28c8ff33;color:#55ddff}.normal{background:#ffa00033;color:#ffcc55}.hard{background:#ff3c143d;color:#ff9966}.expert{background:#b43cff3d;color:#ddaaff}#coin{color:#ffd050;font-weight:900}button{border:0;color:inherit;font-family:inherit}#cfg{font-size:20px;border-radius:12px;padding:8px;background:#ff7a3033}main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px}#grid{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:8px 6px;justify-items:center}.b{transition:.2s;display:flex;flex-direction:column;align-items:center}.b.sel{transform:translateY(-13px) scale(1.06);filter:drop-shadow(0 0 15px #fff8)}.b.h{animation:h .6s infinite}.b.s{animation:s .35s}@keyframes h{50%{filter:brightness(2.2)}}@keyframes s{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}.cap{width:var(--bw,54px);height:18px;border-radius:15px 15px 3px 3px;background:linear-gradient(#555,#050505)}.body{position:relative;width:var(--bw,54px);height:var(--bh,132px);border:2px solid #dcefff44;border-radius:3px 3px 17px 17px;overflow:hidden;background:#ffffff12;box-shadow:inset -12px 0 24px #0008}.liq{position:absolute;inset:0;display:flex;flex-direction:column-reverse}.seg{flex:1;position:relative;border-bottom:1px solid #0005}.sym:before{content:attr(data-s);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:white;text-shadow:0 2px 5px black}.light:before{color:#000c;text-shadow:0 1px 1px #fff}.glass{position:absolute;inset:0;background:linear-gradient(90deg,#fff6,#fff1 25%,transparent 60%,#0005);pointer-events:none}.act{flex:1;border-radius:14px;background:linear-gradient(160deg,#ff8c20,#e85000);font-size:9px;font-weight:800;padding:7px 2px}.act:disabled{opacity:.3}.act.on{background:linear-gradient(160deg,#7c5cff,#3516b8)}.ico{display:block;font-size:20px}.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.hidden{display:none}.card{background:#080d22;border:1px solid #78a0ff55;border-radius:22px;padding:22px;max-width:360px;width:100%}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #fff1;padding:12px 0}.grp{display:flex;gap:5px;flex-wrap:wrap}.pill,.btn{background:#ffffff14;border:1px solid #ffffff30;border-radius:9px;padding:8px;font-weight:900}.pill.on{background:#ff7a3070}.btn{width:100%;margin-top:12px}.danger{color:#ffb1b1;background:#ef444420}.center{text-align:center}</style><div id=app><header><div><div class=stage id=sn>Stage 1</div><div id=sd class="badge easy">EASY / 4色</div></div><div id=coin>🪙 <span id=cv>100</span></div><button id=cfg>⚙️</button></header><main><div id=grid></div></main><footer><button class=act id=undo><span class=ico>↩</span>Undo</button><button class=act id=restart><span class=ico>↺</span>Restart</button><button class=act id=hint><span class=ico>💡</span>Hint<br>-10</button><button class=act id=extra><span class=ico>🧪</span>+Bottle<br>-20</button><button class=act id=sym><span class=ico>🔣</span>Symbol<br><span id=symt>OFF</span></button></footer></div><div id=set class="modal hidden"><div class=card><h2 class=center>⚙️ 設定</h2><div class=row><b>難易度</b><div class=grp id=diffs><button class=pill data-d=easy>EASY</button><button class=pill data-d=normal>NORMAL</button><button class=pill data-d=hard>HARD</button><button class=pill data-d=expert>EXPERT</button></div></div><div class=row><span>説明</span><span id=desc>4色 / 20本</span></div><button class="btn danger" id=reset>データ初期化</button><button class=btn id=close>閉じる</button></div></div><div id=clear class="modal hidden"><div class=card><h1 class=center>🎉 Complete!</h1><p class=center style="color:#ffd050;font-weight:900">+20 コイン</p><p class=center id=total></p><button class=btn id=next>Next Stage →</button></div></div><script>const CAP=4,IC=100,HC=10,XC=20,RW=20,CN=['red','blue','green','yellow','orange','cyan','purple','pink','gray','brown','lime','teal','cream','indigo','silver','lavender'],CS={red:['linear-gradient(#ff3333,#bb0000)','●'],blue:['linear-gradient(#3344ff,#0011cc)','■'],green:['linear-gradient(#00ee55,#009933)','＋'],yellow:['linear-gradient(#ffee00,#ccaa00)','★',1],orange:['linear-gradient(#ff9900,#cc5500)','▲'],cyan:['linear-gradient(#00aaff,#0066bb)','○',1],purple:['linear-gradient(#cc00ff,#8800cc)','◆'],pink:['linear-gradient(#ff44bb,#cc0066)','♥'],gray:['linear-gradient(#bbbbbb,#777777)','×',1],brown:['linear-gradient(#cc6622,#884411)','⬟'],lime:['linear-gradient(#ccff00,#88bb00)','✚',1],teal:['linear-gradient(#00ffcc,#009977)','◇'],cream:['linear-gradient(#fffff0,#eecc88)','☀',1],indigo:['linear-gradient(#7722ff,#4400bb)','⬢'],silver:['linear-gradient(#aaccee,#7799bb)','✦',1],lavender:['linear-gradient(#dd99ff,#9966cc)','✿',1]},DC={easy:['EASY',4],normal:['NORMAL',8],hard:['HARD',12],expert:['EXPERT',16]};let S={lv:1,co:100,d:'easy',sy:false,sel:null,b:[],ini:[],hi:[],h:[],x:0};const $=i=>document.getElementById(i),K='chroma20';class R{constructor(s){this.s=s>>>0}n(){let s=(this.s+0x6D2B79F5)|0;this.s=s;s=Math.imul(s^s>>>15,1|s);s=s+Math.imul(s^s>>>7,61|s)^s;return((s^s>>>14)>>>0)/4294967296}i(n){return Math.floor(this.n()*n)}}function save(){localStorage.setItem(K,JSON.stringify({...S,sel:null,hi:[]}))}function load(){try{let x=JSON.parse(localStorage.getItem(K));if(x&&x.b){S={...S,...x,sel:null,hi:[]};return}}catch(e){}stage(1,'easy',false)}function stage(l=S.lv,d=S.d,k=true){let c=S.co,n=DC[d]?.[1]||4,r=new R(l*7919+n*1009),p=[];for(let g=0;g<16;g++)for(let i=0;i<4;i++)p.push(CN[g%n]);for(let i=p.length-1;i>0;i--){let j=r.i(i+1);[p[i],p[j]]=[p[j],p[i]]}let b=[];for(let i=0;i<16;i++)b.push(p.slice(i*4,i*4+4));for(let i=0;i<4;i++)b.push([]);S={...S,lv:l,d,co:k?c:IC,sel:null,b,ini:b.map(x=>x.slice()),hi:[],h:[],x:0};save();render()}function top(a){return a[a.length-1]}function ok(a){return !a.length||a.length==4&&a.every(x=>x==a[0])}function can(f,t){return f.length&&t.length<4&&(!t.length||top(t)==top(f))}function run(a){let t=top(a),n=0;for(let i=a.length-1;i>=0&&a[i]==t;i--)n++;return n}function mv(f,t){if(!can(S.b[f],S.b[t]))return 0;let n=Math.min(run(S.b[f]),4-S.b[t].length);while(n--)S.b[t].push(S.b[f].pop());return 1}function won(){return S.b.every(ok)}function size(){let h=document.querySelector('main').clientHeight,w=$('grid').clientWidth,bh=Math.max(78,Math.min(150,Math.floor((h-44)/4)-20)),bw=Math.max(42,Math.min(64,Math.floor((w-24)/5)-4));document.documentElement.style.setProperty('--bh',bh+'px');document.documentElement.style.setProperty('--bw',bw+'px')}function render(){let [lab,n]=DC[S.d];$('sn').textContent='Stage '+S.lv;$('sd').textContent=lab+' / '+n+'色';$('sd').className='badge '+S.d;$('cv').textContent=S.co;$('undo').disabled=!S.h.length;$('hint').disabled=S.co<HC;$('extra').disabled=S.co<XC||S.x>=3;$('sym').classList.toggle('on',S.sy);$('symt').textContent=S.sy?'ON':'OFF';$('desc').textContent=n+'色 / 20本';document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('on',b.dataset.d==S.d));size();let g=$('grid');g.innerHTML='';S.b.forEach((a,i)=>{let w=document.createElement('div');w.className='b';if(S.sel==i)w.classList.add('sel');if(S.hi.includes(i))w.classList.add('h');w.dataset.i=i;w.innerHTML='<div class=cap></div><div class=body><div class=liq></div><div class=glass></div></div>';let q=w.querySelector('.liq');for(let j=0;j<4;j++){let s=document.createElement('div');s.className='seg';if(a[j]){let c=CS[a[j]];s.style.background=c[0];if(S.sy){s.classList.add('sym');if(c[2])s.classList.add('light');s.dataset.s=c[1]}}q.appendChild(s)}g.appendChild(w)})}function tap(i){if(S.sel==null){if(!S.b[i].length)return bad(i);S.sel=i;return render()}if(S.sel==i){S.sel=null;return render()}let f=S.sel;if(!can(S.b[f],S.b[i]))return bad(i);S.h.push({b:S.b.map(x=>x.slice()),x:S.x});mv(f,i);S.sel=null;render();won()?win():save()}function bad(i){let e=document.querySelector(`[data-i="${i}"]`);if(e){e.classList.add('s');setTimeout(()=>e.classList.remove('s'),400)}}function hint(){if(S.co<HC)return;for(let i=0;i<S.b.length;i++)for(let j=0;j<S.b.length;j++)if(i!=j&&!ok(S.b[i])&&can(S.b[i],S.b[j])){S.co-=HC;S.hi=[i,j];save();render();setTimeout(()=>{S.hi=[];render()},2500);return}}function win(){S.co+=RW;$('total').textContent='合計: '+S.co+' 🪙';$('clear').classList.remove('hidden');save()}document.addEventListener('DOMContentLoaded',()=>{load();render();$('grid').onclick=e=>{let b=e.target.closest('.b');if(b)tap(+b.dataset.i)};$('undo').onclick=()=>{let h=S.h.pop();if(h){S.b=h.b.map(x=>x.slice());S.x=h.x;render();save()}};$('restart').onclick=()=>{S.b=S.ini.map(x=>x.slice());S.h=[];render();save()};$('hint').onclick=hint;$('extra').onclick=()=>{if(S.co>=XC&&S.x<3){S.h.push({b:S.b.map(x=>x.slice()),x:S.x});S.co-=XC;S.x++;S.b.push([]);render();save()}};$('sym').onclick=()=>{S.sy=!S.sy;render();save()};$('cfg').onclick=()=>{$('set').classList.remove('hidden');render()};$('close').onclick=()=>$('set').classList.add('hidden');document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{stage(1,b.dataset.d,true);$('set').classList.add('hidden')});$('reset').onclick=()=>{if(confirm('初期化しますか？')){localStorage.removeItem(K);stage(1,'easy',false);$('set').classList.add('hidden')}};$('next').onclick=()=>{$('clear').classList.add('hidden');stage(S.lv+1,S.d,true)};addEventListener('resize',()=>setTimeout(render,100))});</script>
