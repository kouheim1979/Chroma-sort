<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chroma Sort</title>
<style>
:root{--bg:#050a1d;--card:rgba(8,14,38,.94);--line:rgba(150,180,255,.25);--txt:#eaf2ff;--sub:rgba(220,235,255,.62);--gold:#ffd050;--bw:54px;--bh:126px}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation}body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:radial-gradient(circle at 18% 5%,#17307a 0,transparent 34%),radial-gradient(circle at 85% 95%,#39166e 0,transparent 38%),linear-gradient(#050a1d,#07102b);color:var(--txt);user-select:none;-webkit-user-select:none}button{font-family:inherit;color:inherit;border:0}#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}.bar{background:rgba(2,6,20,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}.stage{font-weight:900;font-size:19px}.diff{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:9px;font-size:10px;font-weight:900;letter-spacing:1px}.easy{background:rgba(0,190,255,.18);color:#5adfff}.normal{background:rgba(255,190,30,.18);color:#ffd15a}.hard{background:rgba(255,80,40,.22);color:#ff9972}.expert{background:rgba(180,60,255,.24);color:#ddaaff}.coins{font-weight:900;color:var(--gold);background:rgba(255,210,60,.1);border:1px solid rgba(255,210,60,.32);border-radius:18px;padding:7px 11px}.gear{width:42px;height:42px;border-radius:13px;border:1px solid rgba(255,150,60,.45);background:rgba(255,130,35,.18);font-size:20px}#game{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}.grid{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:8px 6px;justify-items:center;align-items:end}.bottle{height:calc(var(--bh) + 20px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;transition:.18s transform,.18s filter}.bottle.sel{transform:translateY(-14px) scale(1.06);filter:drop-shadow(0 0 18px rgba(255,255,255,.45))}.bottle.hint{animation:hint .55s ease-in-out infinite}@keyframes hint{50%{filter:brightness(2.2) drop-shadow(0 0 16px rgba(255,240,0,.9))}}.bottle.shake{animation:shake .35s}@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}.cap{width:var(--bw);height:20px;border-radius:18px 18px 4px 4px;background:linear-gradient(160deg,#4c4c4c,#050505);box-shadow:0 4px 10px rgba(0,0,0,.65),inset 0 1px 3px rgba(255,255,255,.25)}.body{width:var(--bw);height:var(--bh);border-radius:3px 3px 17px 17px;border:2px solid rgba(220,240,255,.28);background:rgba(180,220,255,.08);overflow:hidden;position:relative;box-shadow:inset -12px 0 24px rgba(0,0,0,.45),inset 8px 0 14px rgba(255,255,255,.1),0 8px 18px rgba(0,0,0,.5)}.liq{position:absolute;inset:0;display:flex;flex-direction:column-reverse}.seg{flex:1;position:relative}.seg+.seg{border-bottom:2px solid rgba(0,0,0,.34)}.seg[data-sym]::before{content:attr(data-sym);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bw)*.35);font-weight:900;color:rgba(255,255,255,.92);text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.75)}.seg.light[data-sym]::before{color:rgba(0,0,0,.78);text-shadow:0 1px 1px rgba(255,255,255,.55)}.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.38),rgba(255,255,255,.08) 25%,transparent 55%,rgba(0,0,0,.34));z-index:3}.done .body{box-shadow:0 0 28px var(--glow),inset -12px 0 24px rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.5)}.footer{display:flex;gap:8px;background:rgba(2,6,20,.92);border-top:1px solid var(--line);padding:10px 12px max(12px,env(safe-area-inset-bottom))}.act{flex:1;border-radius:16px;background:linear-gradient(160deg,#ff9328,#dc4f00);padding:8px 2px;font-size:9px;font-weight:800;box-shadow:0 4px 14px rgba(210,75,0,.45)}.act:disabled{opacity:.35}.act.on{background:linear-gradient(160deg,#7c5cff,#3516b8)}.act span{display:block;font-size:20px;line-height:1}.act small{display:block;color:rgba(255,255,255,.75);font-size:9px;font-weight:700}.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.74);backdrop-filter:blur(12px);padding:22px;z-index:20}.hidden{display:none}.card{width:100%;max-width:370px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.55)}.card h2{text-align:center;margin-bottom:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}.row:last-child{border-bottom:0}.lbl{font-size:14px;color:var(--sub);font-weight:700}.grp{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.pill,.close,.danger,.next{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:900}.pill.on{background:rgba(255,135,35,.45);border-color:rgba(255,160,60,.75);color:#fff}.close,.danger,.next{width:100%;margin-top:12px;padding:13px;border-radius:14px}.danger{background:rgba(240,70,70,.16);color:#ffb1b1;border-color:rgba(240,70,70,.35)}.next{background:linear-gradient(135deg,#5c40e8,#2c13a8);border:0}.center{text-align:center}@media(max-height:720px){:root{--bh:104px;--bw:48px}.grid{gap:5px 4px}.bar{padding:7px 10px}.footer{padding:7px 10px}}
</style>
</head>
<body>
<div id="app">
<header class="bar"><div><div class="stage" id="stage">Stage 1</div><div id="diff" class="diff easy">EASY / 4色</div></div><div class="coins">🪙 <span id="coins">100</span></div><button class="gear" id="open">⚙️</button></header>
<main id="game"><div class="grid" id="grid"></div></main>
<footer class="footer"><button class="act" id="undo"><span>↩</span>Undo</button><button class="act" id="restart"><span>↺</span>Restart</button><button class="act" id="hint"><span>💡</span>Hint<small>-10</small></button><button class="act" id="extra"><span>🧪</span>+Bottle<small>-20</small></button><button class="act" id="sym"><span>🔣</span>Symbol<small id="symTxt">OFF</small></button></footer>
</div>
<div id="settings" class="modal hidden"><div class="card"><h2>⚙️ 設定</h2><div class="row"><span class="lbl">🎚️ 難易度</span><div class="grp" id="diffBtns"><button class="pill" data-d="easy">EASY</button><button class="pill" data-d="normal">NORMAL</button><button class="pill" data-d="hard">HARD</button><button class="pill" data-d="expert">EXPERT</button></div></div><div class="row"><span class="lbl">説明</span><span class="lbl" id="desc">4色 / 20本</span></div><button class="danger" id="reset">データ初期化</button><button class="close" id="close">閉じる</button></div></div>
<div id="clear" class="modal hidden"><div class="card center"><h1>🎉 Complete!</h1><p style="color:#ffd050;font-weight:900;margin:12px">+20 コイン</p><p id="total"></p><button class="next" id="next">Next Stage →</button></div></div>
<script>
'use strict';
const CAP=4,IC=100,HCOST=10,XCOST=20,REWARD=20,MAX_EXTRA=3;
const DIFFS={easy:{label:'EASY',colors:4},normal:{label:'NORMAL',colors:8},hard:{label:'HARD',colors:12},expert:{label:'EXPERT',colors:16}};
const ORDER=['easy','normal','hard','expert'];
const COLORS=[
{id:'red',sym:'●',bg:'linear-gradient(#ff3333,#bb0000)',gl:'#ff1111'},
{id:'blue',sym:'■',bg:'linear-gradient(#3344ff,#0011cc)',gl:'#2233ff'},
{id:'green',sym:'＋',bg:'linear-gradient(#00ee55,#009933)',gl:'#00ff44'},
{id:'yellow',sym:'★',bg:'linear-gradient(#ffee00,#ccaa00)',gl:'#ffdd00',light:true},
{id:'orange',sym:'▲',bg:'linear-gradient(#ff9900,#cc5500)',gl:'#ff7700'},
{id:'cyan',sym:'○',bg:'linear-gradient(#00aaff,#0066bb)',gl:'#00aaff',light:true},
{id:'purple',sym:'◆',bg:'linear-gradient(#cc00ff,#8800cc)',gl:'#bb00ff'},
{id:'pink',sym:'♥',bg:'linear-gradient(#ff44bb,#cc0066)',gl:'#ff22aa'},
{id:'gray',sym:'×',bg:'linear-gradient(#bbbbbb,#777777)',gl:'#aaaaaa',light:true},
{id:'brown',sym:'⬟',bg:'linear-gradient(#cc6622,#884411)',gl:'#bb5511'},
{id:'lime',sym:'✚',bg:'linear-gradient(#ccff00,#88bb00)',gl:'#bbff00',light:true},
{id:'teal',sym:'◇',bg:'linear-gradient(#00ffcc,#009977)',gl:'#00ffaa'},
{id:'cream',sym:'☀',bg:'linear-gradient(#fffff0,#eecc88)',gl:'#ffffff',light:true},
{id:'indigo',sym:'⬢',bg:'linear-gradient(#7722ff,#4400bb)',gl:'#6611ff'},
{id:'silver',sym:'✦',bg:'linear-gradient(#aaccee,#7799bb)',gl:'#99bbdd',light:true},
{id:'lavender',sym:'✿',bg:'linear-gradient(#dd99ff,#9966cc)',gl:'#ccaaff',light:true}
];
const C=Object.fromEntries(COLORS.map(x=>[x.id,x]));
const KEY='chroma-sort-v9';
let S={stage:1,coins:IC,diff:'easy',symbols:false,bottles:[],initial:[],history:[],selected:null,hints:[],extra:0};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function save(){localStorage.setItem(KEY,JSON.stringify({...S,selected:null,hints:[]}))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.bottles)){S={...S,...x,selected:null,hints:[]};return}}catch(e){}newStage(1,'easy',false)}
function makeBoard(stage,diff){const colorCount=DIFFS[diff].colors;const names=COLORS.slice(0,colorCount).map(c=>c.id);const pool=[];for(let bottle=0;bottle<16;bottle++){const color=names[bottle%colorCount];for(let i=0;i<CAP;i++)pool.push(color)}const r=rng(stage*9127+colorCount*311);for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}const b=[];for(let i=0;i<16;i++)b.push(pool.slice(i*CAP,i*CAP+CAP));for(let i=0;i<4;i++)b.push([]);return b}
function newStage(stage=S.stage,diff=S.diff,keepCoins=true){const coins=keepCoins?S.coins:IC;const b=makeBoard(stage,diff);S={...S,stage,diff,coins,bottles:b,initial:b.map(x=>x.slice()),history:[],selected:null,hints:[],extra:0};save();render()}
function top(a){return a[a.length-1]}function run(a){if(!a.length)return 0;const t=top(a);let n=0;for(let i=a.length-1;i>=0&&a[i]===t;i--)n++;return n}function complete(a){return !a.length||(a.length===CAP&&a.every(x=>x===a[0]))}function canMove(from,to){const f=S.bottles[from],t=S.bottles[to];return f.length&&t.length<CAP&&(!t.length||top(t)===top(f))}function move(from,to){if(!canMove(from,to))return false;const f=S.bottles[from],t=S.bottles[to];let n=Math.min(run(f),CAP-t.length);while(n--)t.push(f.pop());return true}function won(){return S.bottles.every(complete)}
function render(){const d=DIFFS[S.diff];document.getElementById('stage').textContent='Stage '+S.stage;const badge=document.getElementById('diff');badge.textContent=d.label+' / '+d.colors+'色';badge.className='diff '+S.diff;document.getElementById('coins').textContent=S.coins;document.getElementById('undo').disabled=!S.history.length;document.getElementById('hint').disabled=S.coins<HCOST;document.getElementById('extra').disabled=S.coins<XCOST||S.extra>=MAX_EXTRA;document.getElementById('sym').classList.toggle('on',S.symbols);document.getElementById('symTxt').textContent=S.symbols?'ON':'OFF';document.getElementById('desc').textContent=d.colors+'色 / 20本';document.querySelectorAll('#diffBtns .pill').forEach(b=>b.classList.toggle('on',b.dataset.d===S.diff));const grid=document.getElementById('grid');grid.innerHTML='';S.bottles.forEach((arr,i)=>{const w=document.createElement('div');w.className='bottle';w.dataset.i=i;if(S.selected===i)w.classList.add('sel');if(S.hints.includes(i))w.classList.add('hint');if(complete(arr)&&arr.length){w.classList.add('done');w.style.setProperty('--glow',C[arr[0]].gl+'99')}w.innerHTML='<div class="cap"></div><div class="body"><div class="liq"></div><div class="glass"></div></div>';const liq=w.querySelector('.liq');for(let j=0;j<CAP;j++){const seg=document.createElement('div');seg.className='seg';if(arr[j]){const c=C[arr[j]];seg.style.background=c.bg;if(S.symbols){seg.dataset.sym=c.sym;if(c.light)seg.classList.add('light')}}liq.appendChild(seg)}grid.appendChild(w)})}
function shake(i){const e=document.querySelector(`.bottle[data-i="${i}"]`);if(e){e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),380)}}
function tap(i){if(S.selected===null){if(!S.bottles[i].length)return shake(i);S.selected=i;S.hints=[];render();return}if(S.selected===i){S.selected=null;render();return}const from=S.selected;if(!canMove(from,i))return shake(i);S.history.push({b:S.bottles.map(x=>x.slice()),extra:S.extra});move(from,i);S.selected=null;S.hints=[];render();if(won()){S.coins+=REWARD;document.getElementById('total').textContent='合計: '+S.coins+' 🪙';document.getElementById('clear').classList.remove('hidden')}save()}
function hint(){if(S.coins<HCOST)return;for(let i=0;i<S.bottles.length;i++)for(let j=0;j<S.bottles.length;j++)if(i!==j&&!complete(S.bottles[i])&&canMove(i,j)){S.coins-=HCOST;S.selected=null;S.hints=[i,j];save();render();setTimeout(()=>{S.hints=[];render()},3000);return}}
document.getElementById('grid').addEventListener('click',e=>{const b=e.target.closest('.bottle');if(b)tap(+b.dataset.i)});document.getElementById('undo').onclick=()=>{const h=S.history.pop();if(!h)return;S.bottles=h.b.map(x=>x.slice());S.extra=h.extra;S.selected=null;S.hints=[];save();render()};document.getElementById('restart').onclick=()=>{S.bottles=S.initial.map(x=>x.slice());S.history=[];S.selected=null;S.hints=[];save();render()};document.getElementById('hint').onclick=hint;document.getElementById('extra').onclick=()=>{if(S.coins<XCOST||S.extra>=MAX_EXTRA)return;S.history.push({b:S.bottles.map(x=>x.slice()),extra:S.extra});S.coins-=XCOST;S.extra++;S.bottles.push([]);save();render()};document.getElementById('sym').onclick=()=>{S.symbols=!S.symbols;save();render()};document.getElementById('open').onclick=()=>{document.getElementById('settings').classList.remove('hidden');render()};document.getElementById('close').onclick=()=>document.getElementById('settings').classList.add('hidden');document.getElementById('settings').onclick=e=>{if(e.target.id==='settings')document.getElementById('settings').classList.add('hidden')};document.querySelectorAll('#diffBtns .pill').forEach(b=>b.onclick=()=>{newStage(1,b.dataset.d,true);document.getElementById('settings').classList.add('hidden')});document.getElementById('reset').onclick=()=>{if(confirm('すべて初期化しますか？')){localStorage.removeItem(KEY);newStage(1,'easy',false);document.getElementById('settings').classList.add('hidden')}};document.getElementById('next').onclick=()=>{document.getElementById('clear').classList.add('hidden');newStage(S.stage+1,S.diff,true)};window.addEventListener('resize',()=>setTimeout(render,120));load();render();
</script>
</body>
</html>
