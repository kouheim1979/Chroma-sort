name: Patch constant 20 bottles

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-constant-20-bottles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Keep 20 bottles and vary colors only') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""/* 難易度ごとに使用色数と空ボトル数を変更 */
const DC={
  easy:  {c:4, b:4, e:2, sh:60},
  normal:{c:8, b:8, e:2, sh:130},
  hard:  {c:12,b:12,e:3, sh:230},
  expert:{c:16,b:16,e:4, sh:380},
};"""
          new="""/* ボトル数は常に20本（カラー16本+空4本）、難易度は色数のみ変更 */
const DC={
  easy:  {c:4, b:16, e:4, sh:60},
  normal:{c:8, b:16, e:4, sh:130},
  hard:  {c:12,b:16, e:4, sh:230},
  expert:{c:16,b:16, e:4, sh:380},
};"""
          if old in s:
              s=s.replace(old,new,1)
          old="""    /* Build pool: each color × CAP */
    const pool=[];
    colors.forEach(c=>{for(let i=0;i<CAP;i++)pool.push(c)});"""
          new="""    /* Build pool: always cfg.b color-bottles worth of segments.
       Fewer colors means each selected color appears in multiple solved bottles. */
    const pool=[];
    for(let group=0;group<cfg.b;group++){
      const c=colors[group%colors.length];
      for(let i=0;i<CAP;i++)pool.push(c);
    }"""
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('check.js').write_text(js)
          PY
          node --check check.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep 20 bottles and vary colors only" || exit 0
          git push
