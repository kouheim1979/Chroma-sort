name: Trigger Chroma patch

on:
  push:
    branches: [ main ]
    paths:
      - '.trigger-chroma-patch'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply difficulty selection and symbol toggle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run stored patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/apply-chroma-sort-update.yml').read_text()
          marker="python3 <<'PY'\n"
          start=y.index(marker)+len(marker)
          end=y.index("\n          PY", start)
          lines=y[start:end].splitlines()
          code="\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          ns={}
          exec(compile(code,'embedded_patch.py','exec'),ns,ns)
          PY
      - name: Verify JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('check.js').write_text(js)
          PY
          node --check check.js
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply difficulty selection and symbol toggle" || exit 0
          git push
